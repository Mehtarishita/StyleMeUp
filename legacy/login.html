<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - StyleMeUp</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>

  <!-- Navbar will be injected from components/navbar.html -->
  <div data-include="components/navbar.html"></div>

  <section class="section" style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 400px; width: 100%; padding: 2rem;">
      <h1 class="section__title" style="margin-bottom: 1rem; text-align: center;">Welcome Back</h1>
      <p class="section__subtitle" style="text-align: center; margin-bottom: 2rem;">Sign in to your StyleMeUp account.</p>
      
      <!-- Note: Real authentication will be implemented in a later phase. This is a static form for now. -->
      <form action="#" method="POST">
        <div style="margin-bottom: 1rem;">
          <label for="email" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Email</label>
          <input type="email" id="email" name="email" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px;" placeholder="you@example.com">
        </div>
        <div style="margin-bottom: 1.5rem;">
          <label for="password" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Password</label>
          <input type="password" id="password" name="password" required style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px;" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn--primary wide" style="width: 100%;">Sign In</button>
      </form>
      <div style="text-align: center; margin-top: 1rem;">
        <p>Don't have an account? <a href="#" style="color: #666; font-weight: 600;">Sign up</a></p>
      </div>
    </div>
  </section>

  <!-- Footer (injected) -->
  <div data-include="components/footer.html"></div>

  <!-- JS -->
  <script src="scripts/main.js"></script>
</body>
</html>
