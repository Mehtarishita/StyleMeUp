<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - StyleMeUp</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>

<body>
  <!-- Navbar -->
   <body>
  <div id="navbar"></div>  <!-- Navbar yaha inject hoga -->

  <!-- Contact Page Content -->
  <section class="contact-page">
    ...
  </section>
  <div id="navbar-container">
    <!-- Navbar included here (same as other pages) -->
  </div>

  <!-- Contact Hero -->
  <section class="contact-hero">
    <h1 class="section__title">GET IN TOUCH <span class="txt-gradient">Touch</span></h1>
    <p class="section__subtitle">We’d love to hear from you! Whether it’s feedback, collabs, or support.</p>
  </section>

  <!-- Contact Form Section -->
  <section class="contact-section">
    <div class="contact-card">
      <h2>Send Us a Message</h2>
      <form id="contactForm">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" required />
        </div>

        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" required />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>

    <div class="contact-info">
      <h2>Other Ways to Connect</h2>
      <p><strong>Email:</strong> hello@stylemeup.com</p>
      <p><strong>Instagram:</strong> @stylemeup</p>
      <p><strong>Phone:</strong> +91 98765 43210</p>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-container">
    <!-- Footer included here -->
  </div>

  <script src="scripts/main.js"></script>
</body>
</html>
<div id="footer"></div>  <!-- Footer yaha inject hoga -->

</body>
