<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore - StyleMeUp</title>
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
  
  <!-- Navbar -->
  <div id="navbar-container">
    <!-- Navbar will be included here (same as index.html) -->
  </div>

  <!-- Explore Hero Section -->
  <section class="explore-hero section">
    <h1 class="section__title">EXPLORE STYLE BOARDS <span class="txt-gradient"></span></h1>
    <p class="section__subtitle">Discover outfits, trends & inspirations curated for you.</p>
  </section>

  <!-- Filters -->
  <div class="filters center">
    <button class="btn btn--light">All</button>
    <button class="btn btn--light">Casual</button>
    <button class="btn btn--light">Formal</button>
    <button class="btn btn--light">Ethnic</button>
    <button class="btn btn--light">Party</button>
  </div>

  <!-- Style Boards Grid -->
  <section class="section">
    <div class="grid boards-grid">
      <div class="board-card">
        <img src="assets/images/explore/streetwear.jpg" alt="Casual Outfit">
        <h3>Casual Streetwear</h3>
      </div>

      <div class="board-card">
        <img src="assets/images/explore/officelook.jpg" alt="Formal Outfit">
        <h3>Formal Office Look</h3>
      </div>

      <div class="board-card">
        <img src="assets/images/explore/ethnic.jpg" alt="Ethnic Outfit">
        <h3>Festive Ethnic</h3>
      </div>

      <div class="board-card">
        <img src="assets/images/explore/nightglam.jpg" alt="Party Outfit">
        <h3>Party Night Glam</h3>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-container">
    <!-- Footer will be included here -->
  </div>

  <script src="scripts/main.js"></script>
</body>
</html>
