<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><h1>Creators' Corner - StyleMeUp</h1></title>
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="styles/creators.css">
</head>
<body>
  <div id="navbar-container"></div>

  <section class="creators-hero">
    <h1>Creators' Corner</h1>
     
</section>
    <p class="section__subtitle">Shop exclusive looks with coupons from your favorite creators </p>
  </section>
 <div class="creator-box">
    <input type="text" placeholder="Paste product link here..." />
    <input type="text" placeholder="Enter your coupon code (optional)" />
    <button>Generate My Link</button>
  </div>

    <!-- Creator Upload Section -->
<section class="creator-section">
  <h2>Add Your Product Links</h2>
  <p>Creators, share your coupon-based product links from Myntra, Ajio, Flipkart, and more 🚀</p>
  
  <div class="creator-box">
    <input type="text" placeholder="Enter Product Name" id="productName">
    <input type="url" placeholder="Paste Product Link (with coupon)" id="productLink">
    <input type="text" placeholder="Your Coupon Code" id="couponCode">
    <button onclick="addProduct()">Add Product</button>
  </div>
</section>

    <div id="productGrid" class="grid product-grid"></div>
    
  </section>

  <div id="footer-container"></div>

  <script src="scripts/main.js"></script>
  <script src="scripts/creators.js"></script>
</body>
</html>
